<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Results - Confide Computer Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-light: #764ba2;
            --accent: #00d4d4;
            --dark: #0f3a3a;
            --light: #f0f9f9;
            --text: #1a1a1a;
            --text-light: #666;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, #e8f8f8 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: 700;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        /* Success Section */
        .success-section {
            background: linear-gradient(135deg, var(--success) 0%, #229954 100%);
            color: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .success-message {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .success-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Failed Section */
        .failed-section {
            background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
            color: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease;
        }

        .failed-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .failed-message {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .failed-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Score Display */
        .score-display {
            text-align: center;
            margin-bottom: 40px;
        }

        .score-number {
            font-size: 80px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .score-label {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 3px solid var(--primary);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .badge-pass {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
        }

        .badge-fail {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        /* Next Steps */
        .next-steps {
            background: #f0f9f9;
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .next-steps h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .next-steps p {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Progress */
        .progress-section {
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .progress-label {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .progress-bar {
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 8px;
            text-align: center;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .results-card {
                padding: 20px;
            }

            .success-section,
            .failed-section {
                padding: 30px;
            }

            .score-number {
                font-size: 60px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-logo">🎓 Confide Academy</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="results-card" id="resultsCard">
            <!-- Results will be populated here -->
        </div>
    </div>

    <script>
        // Get query parameters
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course') || 'unknown';
        const score = parseInt(params.get('score')) || 0;
        const passed = params.get('passed') === 'true';
        const correct = parseInt(params.get('correct')) || 0;
        const total = parseInt(params.get('total')) || 0;

        // Course display names
        const courseNames = {
            'html': 'HTML Fundamentals',
            'css': 'CSS Styling',
            'javascript': 'JavaScript Programming'
        };

        // Progress tracking (1=HTML, 2=CSS, 3=JS)
        const courseProgress = {
            'html': 1,
            'css': 2,
            'javascript': 3
        };

        // Get progress number once to avoid redeclaration
        const progressNum = courseProgress[course] || 0;

        // Populate results
        function displayResults() {
            const courseDisplay = courseNames[course] || course;
            const resultsCard = document.getElementById('resultsCard');

            let html = '';

            // Main Status Section
            if (passed) {
                html = `
                    <div class="success-section">
                        <div class="success-icon">🎉</div>
                        <div class="success-message">Excellent Work!</div>
                        <div class="success-subtitle">You have successfully completed <strong>${courseDisplay}</strong>!</div>
                    </div>
                `;
            } else {
                html = `
                    <div class="failed-section">
                        <div class="failed-icon">📊</div>
                        <div class="failed-message">Keep Learning!</div>
                        <div class="failed-subtitle">You didn't pass this time. Let's try again!</div>
                    </div>
                `;
            }

            // Score Display
            html += `
                <div class="score-display">
                    <div class="score-number">${score}%</div>
                    <div class="score-label">Your Score</div>
                </div>

                <div class="badge ${passed ? 'badge-pass' : 'badge-fail'}">
                    ${passed ? '✓ PASSED' : '✗ NOT PASSED (Need 60%)'}
                </div>
            `;

            // Stats
            html += `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${correct}</div>
                        <div class="stat-label">Correct Answers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${total}</div>
                        <div class="stat-label">Total Questions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${Math.round((correct/total)*100)}%</div>
                        <div class="stat-label">Accuracy</div>
                    </div>
                </div>
            `;

            // Progress Bar (if passed, show progress)
            if (passed) {
                const progressPercent = (progressNum / 3) * 100;
                html += `
                    <div class="progress-section">
                        <div class="progress-label">📚 Overall Program Progress</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="progress-text">${progressNum} of 3 courses completed</div>
                    </div>
                `;
            }

            // Next Steps
            if (passed) {
                if (progressNum === 3) {
                    html += `
                        <div class="next-steps">
                            <h3>✅ Congratulations!</h3>
                            <p>You've completed all 3 courses! Your final certificate and professional performance report are being prepared. Click "View Results" to see your complete assessment results and download your certificate.</p>
                        </div>
                    `;
                } else {
                    const nextCourse = progressNum === 1 ? 'CSS Styling' : progressNum === 2 ? 'JavaScript Programming' : 'Complete';
                    html += `
                        <div class="next-steps">
                            <h3>✅ What's Next?</h3>
                            <p>Great job! You've passed this course. Return to your dashboard to unlock and start <strong>${nextCourse}</strong>. Once you complete all 3 courses, your final certificate and performance report will be generated!</p>
                        </div>
                    `;
                }
            } else {
                html += `
                    <div class="next-steps">
                        <h3>📚 Recommendation</h3>
                        <p>You need at least 60% to pass. Review the material and try again. You can retake this assessment anytime from your dashboard!</p>
                    </div>
                `;
            }

            // Actions
            html += `
                <div class="actions">
            `;

            if (passed && progressNum === 3) {
                html += `<button class="btn btn-primary" onclick="goToCompletion()">📊 View Final Results</button>`;
            } else {
                html += `<button class="btn btn-primary" onclick="goToAssessmentSession()">Back to Assessment Session</button>`;
            }

            if (!passed) {
                html += `<button class="btn btn-secondary" onclick="retakeAssessment()">🔄 Retake Assessment</button>`;
            }

            html += `</div>`;

            resultsCard.innerHTML = html;
        }

        // Go to Assessment Session (updated redirect)
        function goToAssessmentSession() {
            window.location.href = '/assessment-session';
        }

        // Go to Completion/Final Results
        function goToCompletion() {
            window.location.href = '/completion';
        }

        // Retake Assessment
        function retakeAssessment() {
            window.location.href = `/assessment/${course}`;
        }

        // Load results on page load
        window.addEventListener('load', displayResults);

        // Auto-redirect to assessment-session after 5 seconds if passed and not final
        if (passed && progressNum < 3) {
            setTimeout(() => {
                window.location.href = '/assessment-session';
            }, 5000);
        }
    </script>
</body>
</html>
