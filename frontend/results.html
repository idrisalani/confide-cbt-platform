<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Results - Confide Computer Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e5a5a;
            --primary-light: #2d7a7a;
            --accent: #00d4d4;
            --dark: #0f3a3a;
            --light: #f0f9f9;
            --text: #1a1a1a;
            --text-light: #666;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, #e8f8f8 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: 700;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        /* Success Section */
        .success-section {
            background: linear-gradient(135deg, var(--success) 0%, #229954 100%);
            color: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .success-message {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .success-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Failed Section */
        .failed-section {
            background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
            color: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
        }

        .failed-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .failed-message {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .failed-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Score Display */
        .score-display {
            text-align: center;
            margin-bottom: 40px;
        }

        .score-number {
            font-size: 80px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .score-label {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 10px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Next Steps */
        .next-steps {
            background: #f0f9f9;
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .next-steps h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .next-steps p {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(30, 90, 90, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(30, 90, 90, 0.4);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .badge-pass {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
        }

        .badge-fail {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .results-card {
                padding: 20px;
            }

            .success-section,
            .failed-section {
                padding: 30px;
            }

            .score-number {
                font-size: 60px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-logo">🎓 Confide Academy</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="results-card" id="resultsCard">
            <!-- Results will be populated here -->
        </div>
    </div>

    <script>
        // Get query parameters
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course') || 'unknown';
        const score = parseInt(params.get('score')) || 0;
        const passed = params.get('passed') === 'true';
        const correct = parseInt(params.get('correct')) || 0;
        const total = parseInt(params.get('total')) || 0;

        // Course display names
        const courseNames = {
            'html': 'HTML Fundamentals',
            'css': 'CSS Styling',
            'javascript': 'JavaScript Programming'
        };

        // Populate results
        function displayResults() {
            const courseDisplay = courseNames[course] || course;
            const resultsCard = document.getElementById('resultsCard');

            let html = '';

            if (passed) {
                html = `
                    <div class="success-section">
                        <div class="success-icon">🎉</div>
                        <div class="success-message">Excellent Work!</div>
                        <div class="success-subtitle">You have successfully completed the assessment!</div>
                    </div>

                    <div class="score-display">
                        <div class="score-number">${score}%</div>
                        <div class="score-label">YOUR SCORE</div>
                    </div>

                    <div class="badge badge-pass">✓ PASSED</div>
                `;
            } else {
                html = `
                    <div class="failed-section">
                        <div class="failed-icon">📊</div>
                        <div class="failed-message">Keep Learning!</div>
                        <div class="failed-subtitle">You didn't pass this time. Let's try again!</div>
                    </div>

                    <div class="score-display">
                        <div class="score-number">${score}%</div>
                        <div class="score-label">YOUR SCORE</div>
                    </div>

                    <div class="badge badge-fail">✗ NOT PASSED (Need 60%)</div>
                `;
            }

            // Stats
            html += `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${correct}</div>
                        <div class="stat-label">Correct Answers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${total}</div>
                        <div class="stat-label">Total Questions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${courseDisplay}</div>
                        <div class="stat-label">Course</div>
                    </div>
                </div>
            `;

            // Next Steps
            if (passed) {
                html += `
                    <div class="next-steps">
                        <h3>✅ What's Next?</h3>
                        <p>Great job! You've passed this course. Return to your dashboard to unlock and start the next course. Once you complete all 3 courses, your final certificate and performance report will be generated!</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="next-steps">
                        <h3>📚 Recommendation</h3>
                        <p>You need at least 60% to pass. Review the material and try again. You can retake this assessment anytime from your dashboard!</p>
                    </div>
                `;
            }

            // Actions
            html += `
                <div class="actions">
                    <button class="btn btn-primary" onclick="goToDashboard()">Back to Dashboard</button>
                    ${!passed ? '<button class="btn btn-secondary" onclick="retakeAssessment()">Retake Assessment</button>' : ''}
                </div>
            `;

            resultsCard.innerHTML = html;
        }

        // Go to Dashboard
        function goToDashboard() {
            window.location.href = '/dashboard';
        }

        // Retake Assessment
        function retakeAssessment() {
            window.location.href = `/assessment/${course}`;
        }

        // Load results on page load
        window.addEventListener('load', displayResults);

        // Auto-redirect to dashboard after 5 seconds if passed
        if (passed) {
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 5000);
        }
    </script>
</body>
</html>
